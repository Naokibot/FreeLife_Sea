name: FreeLifeMarineMobs
version: 1.10.0
main: com.sagakenichi.freelifemarine.FreeLifeMarineMobsPlugin
api-version: '1.21'
author: Naokibot
description: Animated marine mobs with configurable orca riding, autonomous roaming, breach jumps, command-block spawning, and scheduled orca shows.
commands:
  marine:
    description: Manage FreeLife marine mobs, calls, tuning, marine food, and orca shows.
    usage: /marine <spawn|call|speed|jump|food|show>
permissions:
  freelifemarine.spawn:
    description: Allows spawning shark, orca, and crab mobs, including from command blocks.
    default: op
  freelifemarine.call:
    description: Allows calling the nearest spawned orca to the player.
    default: op
  freelifemarine.tune:
    description: Allows changing an orca's riding speed and jump height.
    default: op
  freelifemarine.food:
    description: Allows receiving the custom marine food item.
    default: op
  freelifemarine.show:
    description: Allows configuring and controlling orca shows.
    default: op
