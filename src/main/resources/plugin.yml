name: FreeLifeMarineMobs
version: '1.2.0'
main: com.sagakenichi.freelifemarine.FreeLifeMarineMobsPlugin
api-version: '1.21'
author: Naokibot
description: Command-only animated shark, orca, and crab mobs with native mounted steering.
commands:
  marine:
    description: Spawn a FreeLife marine mob.
    usage: /marine spawn <shark|orca|crab>
    permission: freelifemarine.spawn
permissions:
  freelifemarine.spawn:
    description: Allows spawning shark, orca, and crab mobs.
    default: op
