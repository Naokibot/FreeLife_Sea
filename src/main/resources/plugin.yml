name: FreeLifeMarineMobs
version: '1.6.0'
main: com.sagakenichi.freelifemarine.FreeLifeMarineMobsPlugin
api-version: '1.21'
author: Naokibot
description: Command-only animated marine mobs with gravity-aware swimming, shallow-pool jumps, ten speed tiers, autonomous jumps, segmented hitboxes, marine food attraction, riding, and scheduled orca shows.
commands:
  marine:
    description: Manage FreeLife marine mobs, marine food, and orca shows.
    usage: /marine <spawn|food|show>
permissions:
  freelifemarine.spawn:
    description: Allows spawning shark, orca, and crab mobs.
    default: op
  freelifemarine.food:
    description: Allows receiving the custom marine food item.
    default: op
  freelifemarine.show:
    description: Allows configuring and controlling orca shows.
    default: op
