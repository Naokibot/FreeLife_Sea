name: Apply active swim and jump 1.10

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/manual-air-gravity-1.9.1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manual-air-gravity-1.9.1
      - name: Patch MarineMobService
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main/java/com/sagakenichi/freelifemarine/MarineMobService.java')
          text = path.read_text(encoding='utf-8')

          def one(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          one('    private static final double MAX_SEAT_SPEED = 1.45;',
              '    private static final double MAX_SEAT_SPEED = 3.60;',
              'passenger seat speed')

          one('        Vector velocity = blendVelocity(mob.anchor.getVelocity(), desired, mob.type.autonomousAcceleration());',
              '        Vector velocity = blendVelocity(mob.anchor.getVelocity(), desired,\n'
              '                mob.type.autonomousAcceleration() * MarineActivityProfile.accelerationMultiplier(mob.type));',
              'autonomous acceleration')

          one('        return hasClearJumpColumn(location, 11);',
              '        return hasClearJumpColumn(location, MarineJumpProfile.clearanceBlocks(mob.type));',
              'jump clearance')

          old_height = '''        mob.jumpHeight = mob.type == MarineMobType.ORCA
                ? ThreadLocalRandom.current().nextInt(3, 11)
                : ThreadLocalRandom.current().nextInt(2, 6);
        int jumpLevel = mob.type == MarineMobType.ORCA
                ? (mob.jumpHeight >= 9 ? 10 : mob.jumpHeight >= 6 ? 9 : 8)
                : (mob.jumpHeight >= 4 ? 7 : 6);
        mob.jumpSpeedLevel = MarineSpeedLevel.of(jumpLevel);'''
          new_height = '''        mob.jumpHeight = ThreadLocalRandom.current().nextInt(
                MarineJumpProfile.minHeightBlocks(mob.type),
                MarineJumpProfile.maxHeightExclusive(mob.type));
        mob.jumpSpeedLevel = MarineSpeedLevel.of(
                MarineJumpProfile.speedLevelForHeight(mob.type, mob.jumpHeight));'''
          one(old_height, new_height, 'jump height selection')

          one('        double verticalVelocity = jumpVelocityForHeight(mob.jumpHeight);',
              '        double verticalVelocity = MarineJumpProfile.initialVerticalVelocity(mob.jumpHeight);',
              'jump launch velocity')

          old_method = '''    private static double jumpVelocityForHeight(int blocks) {
        return switch (Math.max(2, Math.min(10, blocks))) {
            case 2 -> 0.545;
            case 3 -> 0.685;
            case 4 -> 0.804;
            case 5 -> 0.910;
            case 6 -> 1.008;
            case 7 -> 1.099;
            case 8 -> 1.185;
            case 9 -> 1.266;
            case 10 -> 1.344;
            default -> 0.545;
        };
    }

'''
          one(old_method, '', 'legacy jump velocity method')

          path.write_text(text, encoding='utf-8')
      - name: Commit source patch
        run: |
          git config user.name 'Naokibot'
          git config user.email '226927452+Naokibot@users.noreply.github.com'
          git add -- src/main/java/com/sagakenichi/freelifemarine/MarineMobService.java
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Increase autonomous activity and breach range'
          git push origin HEAD:feature/manual-air-gravity-1.9.1
