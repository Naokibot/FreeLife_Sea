name: Apply gravity shallow-water patch

on:
  push:
    branches: [ feature/gravity-shallow-water-1.6 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gravity-shallow-water-1.6
      - name: Patch MarineMobService
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main/java/com/sagakenichi/freelifemarine/MarineMobService.java')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '        mob.anchor.setGravity(false);\n        mob.anchor.setVelocity(new Vector());',
                  '        mob.anchor.setGravity(true);\n        mob.anchor.setVelocity(new Vector());'
              ),
              (
                  '        mob.anchor.setGravity(!isWaterContact(mob.anchor.getLocation()));\n        refreshNaturalIntent(mob);',
                  '        mob.anchor.setGravity(true);\n        refreshNaturalIntent(mob);'
              ),
              (
                  '        Vector velocity = direction.multiply(speed).setY(vertical);\n        mob.anchor.setGravity(false);\n        mob.anchor.setVelocity(velocity);',
                  '        if (isWaterContact(current)) {\n            vertical = MarineWaterPhysics.swimmingVertical(vertical);\n        }\n        Vector velocity = direction.multiply(speed).setY(vertical);\n        mob.anchor.setGravity(true);\n        mob.anchor.setVelocity(velocity);'
              ),
              (
                  '        Vector slowed = mob.anchor.getVelocity().multiply(0.28);\n        slowed.setY(0.0);\n        mob.anchor.setGravity(false);\n        mob.anchor.setVelocity(slowed);',
                  '        Vector slowed = mob.anchor.getVelocity().multiply(0.28);\n        slowed.setY(isWaterContact(mob.anchor.getLocation())\n                ? MarineWaterPhysics.SWIM_LIFT_PER_TICK : slowed.getY());\n        mob.anchor.setGravity(true);\n        mob.anchor.setVelocity(slowed);'
              ),
              (
                  '        mob.anchor.setGravity(!inWater);\n\n        if (!inWater) {',
                  '        mob.anchor.setGravity(true);\n\n        if (!inWater) {'
              ),
              (
                  '        if (!isWaterAt(location.clone().add(0.0, -1.0, 0.0))\n                || !isWaterAt(location.clone().add(0.0, -2.0, 0.0))) {\n            return false;\n        }',
                  '        if (!MarineWaterPhysics.supportsTwoBlockPool(\n                isWaterAt(location),\n                isWaterAt(location.clone().add(0.0, -1.0, 0.0)))) {\n            return false;\n        }'
              ),
              (
                  '        mob.jumpPhase = AutonomousJumpPhase.DIVE;\n        mob.jumpPhaseTicks = mob.type == MarineMobType.ORCA ? 24 : 18;',
                  '        Location location = mob.anchor.getLocation();\n        mob.shallowJump = MarineWaterPhysics.isShallowTwoBlockPool(\n                isWaterAt(location),\n                isWaterAt(location.clone().add(0.0, -1.0, 0.0)),\n                isWaterAt(location.clone().add(0.0, -2.0, 0.0)));\n        mob.jumpPhase = AutonomousJumpPhase.DIVE;\n        mob.jumpPhaseTicks = MarineWaterPhysics.diveTicks(mob.shallowJump, mob.type);'
              ),
              (
                  '            vertical = -0.095;\n            acceleration = 0.12;',
                  '            vertical = MarineWaterPhysics.diveVertical(mob.shallowJump);\n            acceleration = mob.shallowJump ? 0.18 : 0.12;'
              ),
              (
                  '                mob.jumpPhase = AutonomousJumpPhase.CHARGE;\n                mob.jumpPhaseTicks = 48;',
                  '                mob.jumpPhase = AutonomousJumpPhase.CHARGE;\n                mob.jumpPhaseTicks = MarineWaterPhysics.chargeTicks(mob.shallowJump);'
              ),
              (
                  '            vertical = 0.135;\n            acceleration = 0.18;',
                  '            vertical = MarineWaterPhysics.CHARGE_VERTICAL;\n            acceleration = mob.shallowJump ? 0.24 : 0.18;'
              ),
              (
                  '        mob.anchor.setGravity(false);\n        mob.anchor.setVelocity(velocity);\n        mob.anchor.setRotation(yaw, (float) clamp(-velocity.getY() * 120.0, -15.0, 15.0));',
                  '        mob.anchor.setGravity(true);\n        mob.anchor.setVelocity(velocity);\n        mob.anchor.setRotation(yaw, (float) clamp(-velocity.getY() * 120.0, -15.0, 15.0));'
              ),
              (
                  '        mob.anchor.setGravity(!inWater);\n        scheduleNextJump(mob);',
                  '        mob.anchor.setGravity(true);\n        mob.shallowJump = false;\n        scheduleNextJump(mob);'
              ),
              (
                  '        Vector desired = forwardFromYaw(yaw).multiply(mob.speedLevel.blocksPerTick());\n        desired.setY(mob.verticalIntent + Math.sin(mob.ageTicks * (mob.type == MarineMobType.ORCA ? 0.035 : 0.025)) * 0.006);',
                  '        Vector desired = forwardFromYaw(yaw).multiply(mob.speedLevel.blocksPerTick());\n        double swimVertical = mob.verticalIntent\n                + Math.sin(mob.ageTicks * (mob.type == MarineMobType.ORCA ? 0.035 : 0.025)) * 0.006;\n        desired.setY(MarineWaterPhysics.swimmingVertical(swimVertical));'
              ),
              (
                  '        double vertical = targetInWater ? clamp(delta.getY() * 0.08, -0.060, 0.060) : 0.0;',
                  '        double vertical = targetInWater\n                ? MarineWaterPhysics.swimmingVertical(clamp(delta.getY() * 0.08, -0.060, 0.060))\n                : 0.0;'
              ),
              (
                  '                horse.setInvisible(true);\n                horse.setSilent(true);\n                horse.setCollidable(false);',
                  '                horse.setInvisible(true);\n                horse.setSilent(true);\n                horse.setGravity(true);\n                horse.setCollidable(false);'
              ),
              (
                  '            slime.setInvisible(true);\n            slime.setSilent(true);\n            slime.setCollidable(false);',
                  '            slime.setInvisible(true);\n            slime.setSilent(true);\n            slime.setGravity(true);\n            slime.setCollidable(false);'
              ),
              (
                  '        private MarineSpeedLevel jumpSpeedLevel = MarineSpeedLevel.LEVEL_8;',
                  '        private MarineSpeedLevel jumpSpeedLevel = MarineSpeedLevel.LEVEL_8;\n        private boolean shallowJump;'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'Hotaru(Naokibot)'
          git config user.email 'sagakatsuyuki.555@gmail.com'
          git add src/main/java/com/sagakenichi/freelifemarine/MarineMobService.java
          git commit -m 'Apply gravity-aware shallow-water swimming'
          git push origin HEAD:feature/gravity-shallow-water-1.6
