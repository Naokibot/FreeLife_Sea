name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and build
        run: mvn -B -U verify
      - name: Verify release jar
        run: |
          JAR=target/FreeLifeMarineMobs-1.1.0-Spigot-1.21.1.jar
          unzip -t "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q 'MarineMobService.class$'
          javap -verbose -classpath "$JAR" com.sagakenichi.freelifemarine.FreeLifeMarineMobsPlugin | grep 'major version: 65'
          if jar tf "$JAR" | grep -Eq '^org/bukkit/'; then
            echo 'Bukkit classes must not be shaded into the plugin.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FreeLifeMarineMobs-1.1.0-Spigot-1.21.1
          path: target/FreeLifeMarineMobs-1.1.0-Spigot-1.21.1.jar
          if-no-files-found: error
